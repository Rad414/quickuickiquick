<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Автослалом</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🏎 Автослалом</h1>

  <div id="hud">
    <span>Очки: <b id="score">0</b></span>
    <span>Км/ч: <b id="speed">100</b></span>
    <span>Лучший: <b id="best">0</b></span>
  </div>

  <canvas id="game" width="360" height="560"></canvas>

  <div id="touch">
    <button id="t-left">◀</button>
    <button id="t-right">▶</button>
  </div>

  <p id="msg"></p>
  <button id="play">Играть</button>
  <script src="script.js"></script>
</body>
</html>
